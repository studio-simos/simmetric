# HTTP-only variant for Coolify: the Coolify proxy (Traefik) terminates TLS
# in front of this container, so nginx must NOT redirect to its own :443
# (which the proxy never forwards). Same proxying rules as nginx.conf.
server {
    listen 80;
    server_name _;

    # D-09 — root cause DOC-04: nginx default 1MB blocked uploads.
    # Aligned with multer (100MB) and express.json (100mb).
    client_max_body_size 100m;

    # Docker internal DNS resolver — re-resolves hostnames every 5s
    # so upstream container IP changes after restart do not cause 502s.
    resolver 127.0.0.11 valid=5s;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Widget static + loader routes — proxy to the widget service. The widget
    # bundle is same-origin-relative (API_BASE "/api", loader builds its iframe
    # src from the script URL), so serving it behind the app origin requires no
    # widget-code changes (151-02, G-151-1a/1b). Variable upstream + resolver
    # (127.0.0.11 valid=5s above) re-resolve the container hostname at request
    # time — never a literal proxy_pass http://widget:3211 (nginx resolves
    # literal upstreams at config load and nginx -t fails without a widget DNS
    # entry). No trailing slash on the proxy_pass value: the full URI
    # /widget/<id>.js / /widget/<id> is preserved.
    location /widget/ {
        set $widget_backend http://widget:3211;
        proxy_pass $widget_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Widget chat is SSE through this origin
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Widget API routes — regex location wins over the plain /api/ prefix
    # below for EXACTLY the widget's four path prefixes (sessions, config,
    # chat, lead). The admin API (no /api/sessions|config|chat|lead paths) and
    # the MCP pin routes (/api/chats, /api/chats/:id/pins) are untouched — the
    # (/|$) terminator bounds the match to these prefixes. The widget iframe's
    # fetch calls (API_BASE "/api") resolve against the app origin and land on
    # the widget service.
    location ~ ^/api/(sessions|config|chat|lead)(/|$) {
        set $widget_backend http://widget:3211;
        proxy_pass $widget_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Widget chat SSE through this origin
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API proxy — forward to server container
    # Variables force Nginx to use the resolver at request time,
    # preventing stale IPs when the server container restarts.
    location /api/ {
        set $server_backend http://server:3000;
        proxy_pass $server_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support for MCP endpoints
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # MCP SSE endpoint — keep alive
    location /api/mcp/ {
        set $server_backend http://server:3000;
        proxy_pass $server_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # Avatar proxy — forward to server container
    location /avatars/ {
        set $server_backend http://server:3000;
        proxy_pass $server_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Branding assets (app icon) — served by the backend via
    # express.static("storage/branding"); mirror /avatars so the <img
    # src="/branding/..."> resolves in production too.
    location /branding/ {
        set $server_backend http://server:3000;
        proxy_pass $server_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — all other routes serve index.html. The SPA is the ONLY
    # response that must refuse framing (clickjacking protection for the admin
    # app), so X-Frame-Options lives here — NOT in the server-level block
    # (151-02 G-151-1a/1b: the widget iframe page under /widget/ must be
    # embeddable in third-party sites; a global SAMEORIGIN header would refuse
    # it). Defining add_header here blocks inheritance of the server-level
    # headers for this location, so the full set is repeated.
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Service worker — must not be cached and must have correct MIME
    location /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }
}