# ============================================================
# Coolify 4.x deployment — Simmetric Chat + Enterprise plugin
#
# WHAT THIS FILE AUTOMATES (vs the plain docker-compose.yml):
#   - builds all 4 app images from the repo (build.context: .. works:
#     Coolify clones the WHOLE repository before running compose)
#   - enterprise plugin mounted at /simmetric-enterprise:ro via an
#     ABSOLUTE host path (ENTERPRISE_PLUGIN_PATH) — Coolify's clone has
#     no sibling repo, so the relative ../../simmetric-enterprise mount
#     is impossible there
#   - NODE_PATH pair kept from the stock compose so the plugin resolves
#     express/shared from the server's node_modules and its own deps
#     (passport, openid-client, node-saml, ...) from the mounted tree
#   - required secrets enforced with :? (Coolify pre-fills these in the
#     UI and refuses to deploy when missing — no more change-me defaults)
#   - LICENSE_KEY interpolated from the Coolify env (absent = Community
#     tier; set = Enterprise)
#   - ENCRYPTION_KEY / API_KEY_HMAC_SECRET deliberately NOT interpolated:
#     the entrypoint auto-provisions them into the server-storage volume
#     (interpolating an unset var to "" would override provisioning —
#     the documented trap in docker-compose.yml:67-75)
#   - no container_name, no host ports for app services: Coolify owns
#     naming and its Traefik proxy owns ingress (assign the domain in
#     the UI to the `frontend` service, port 80)
#   - docker.sock NOT mounted by default (root-equivalent; only needed
#     for the Ollama Cloud login flow — uncomment in the server block)
#
# MANUAL STEPS (cannot be automated by compose) — see
# docs/COOLIFY.md for the step-by-step runbook:
#   1. rsync the built simmetric-enterprise/ tree to /opt/simmetric-enterprise
#      on the Coolify server (hardcoded in the server volumes — edit the file
#      to change; ENTERPRISE_PLUGIN_PATH env is NOT used here anymore because
#      Coolify rejects ${...} in volume sources)
#   2. fill the :? secrets in the Coolify env UI (openssl rand -base64 32)
#   3. paste LICENSE_KEY (RS256 JWT) — Enterprise vs Community
#   4. assign the public domain to `frontend` port 80 in the UI
#   5. optional: ollama model pre-pull (docker exec ... ollama pull)
# ============================================================

services:
  # ─── Frontend (Nginx, HTTP only — Coolify proxy terminates TLS) ───
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    # http-only nginx.conf: Coolify's Traefik terminates TLS in front, so the
    # stock 80→443 redirect would bounce users into a dead port.
    volumes:
      - ./nginx.coolify.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  # ─── Server (Express API) ──────────────────────────
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    expose:
      - "3000"
    volumes:
      - server-storage:/app/storage
      # Coolify forbids ${...} in volume sources (anti-injection validation),
      # so these two host paths are HARDCODED — edit this file to change them:
      #   /var/backups                  → local backup destination
      #   /opt/simmetric-enterprise     → enterprise plugin tree (rsync target;
      #     absent/empty dir = Community mode, server logs it at info level)
      - /var/backups:/var/backups:rw
      - /opt/simmetric-enterprise:/simmetric-enterprise:ro
      # ─── OPTIONAL: Ollama Cloud login flow (root-equivalent!) ───
      # Uncomment ONLY if you need `ollama login` cloud auth via the host
      # daemon, and align OLLAMA_CONTAINER_NAME with the real container name
      # (Coolify assigns its own names — find it with `docker ps | grep ollama`).
      # - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NODE_ENV=production
      - SERVER_PORT=3000
      - SERVER_URL=${APP_URL:?Set APP_URL to the public https:// origin — used by the frontend widget-URL util}
      - COLLECTOR_URL=http://collector:3210
      - COLLECTOR_PORT=3210
      - WIDGET_SERVICE_URL=http://widget:3211
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-true}
      - DISABLE_TELEMETRY=${DISABLE_TELEMETRY:-true}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-simmetricchat}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (openssl rand -base64 32)}@postgres:5432/${POSTGRES_DB:-simmetricchat}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET (openssl rand -base64 32)}
      # LICENSE_KEY: RS256 JWT from the license tool. Absent/empty → the
      # license service falls back to Community tier (licenseService.ts:109).
      # Interpolation (not env_file) is the Coolify-native channel.
      - LICENSE_KEY=${LICENSE_KEY:-}
      # LLM defaults — Ollama in-stack
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_MODEL=${LLM_MODEL:-gemma4:latest}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${LLM_MODEL:-gemma4:latest}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-10m}
      - OLLAMA_CONTAINER_NAME=${OLLAMA_CONTAINER_NAME:-simmetric-chat-ollama}
      # NODE_PATH pair (from the stock compose): the enterprise bind mount
      # follows the image symlink /simmetric-enterprise (outside node_modules),
      # so Node resolves express/shared from the server's node_modules and the
      # plugin-only deps from the mounted /simmetric-enterprise/node_modules.
      - NODE_PATH=/app/packages/server/node_modules:/simmetric-enterprise/node_modules
      - COLLECTOR_SECRET=${COLLECTOR_SECRET:?Set COLLECTOR_SECRET (openssl rand -base64 32)}
      # WIDGET_API_KEY: symmetric shared secret server↔widget — MUST equal the
      # widget service value below (same Coolify variable = same value).
      - WIDGET_API_KEY=${WIDGET_API_KEY:?Set WIDGET_API_KEY (openssl rand -base64 32)}
      - REDIS_URL=redis://redis:6379
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-local}
      - VECTOR_DB_PROVIDER=${VECTOR_DB_PROVIDER:-lancedb}
      - SEED_BOOTSTRAP_ADMIN=${SEED_BOOTSTRAP_ADMIN:-true}
      # CORS allowlist for the SPA origin (SEC-01) — defaults cover dev only,
      # so the Coolify origin must be explicit.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS to the app origin, e.g. https://chat.example.com}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─── Collector (Document Ingestion) ────────────────
  collector:
    build:
      context: ..
      dockerfile: docker/Dockerfile.collector
    expose:
      - "3210"
    volumes:
      - collector-storage:/app/storage
      - server-storage:/app/server-storage:ro
      - xenova-cache:/app/.cache/xenova
    environment:
      - NODE_ENV=production
      - COLLECTOR_PORT=3210
      - STORAGE_PATH=/app/storage
      - SERVER_STORAGE_PATH=/app/server-storage
      - SERVER_URL=http://server:3000
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-10m}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-local}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-Xenova/all-MiniLM-L6-v2}
      - VECTOR_DB_PROVIDER=${VECTOR_DB_PROVIDER:-lancedb}
      - COLLECTOR_SECRET=${COLLECTOR_SECRET:?Set COLLECTOR_SECRET (openssl rand -base64 32)}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - XENOVA_CACHE_DIR=/app/.cache/xenova
      - HF_ALLOW_REMOTE_MODELS=${HF_ALLOW_REMOTE_MODELS:-true}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3210/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ─── Widget Service (Embeddable Chat) ──────────────
  widget:
    build:
      context: ..
      dockerfile: docker/Dockerfile.widget
    expose:
      - "3211"
    volumes:
      - widget-storage:/app/storage
    environment:
      - NODE_ENV=production
      - WIDGET_PORT=3211
      - SERVER_URL=http://server:3000
      # Same variable as the server → same value → the shared secret matches.
      - WIDGET_API_KEY=${WIDGET_API_KEY:?Set WIDGET_API_KEY (openssl rand -base64 32)}
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3211/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ─── PostgreSQL (Default Database) ───────────────
  postgres:
    image: pgvector/pgvector:pg16
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simmetricchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (openssl rand -base64 32)}
      POSTGRES_DB: ${POSTGRES_DB:-simmetricchat}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB:-simmetricchat} -U ${POSTGRES_USER:-simmetricchat}"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ─── Ollama (Local LLM) ──────────────────────────
  ollama:
    image: ollama/ollama:latest
    environment:
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-10m}
      - OLLAMA_HOST=0.0.0.0:11434
    expose:
      - "11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      # ollama/ollama ships NO curl/wget — `ollama ls` probes its own daemon.
      test: ["CMD-SHELL", "ollama ls >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ─── Redis (Horizontal Scaling Cache) ────────────
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ─── Qdrant (Vector Database — only used when VECTOR_DB_PROVIDER=qdrant) ───
  qdrant:
    image: qdrant/qdrant:latest
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333
    healthcheck:
      # qdrant ships no curl/wget — bash /dev/tcp socket probe.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  server-storage:
  collector-storage:
  xenova-cache:
  widget-storage:
  pgdata:
  ollama-data:
  redis-data:
  qdrant-storage: